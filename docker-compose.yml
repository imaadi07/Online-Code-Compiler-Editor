services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codecraft-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DOCKER_SOCKET=/var/run/docker.sock
    volumes:
      # Mount host Docker socket so backend container can spawn isolated code runners
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - codecraft-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codecraft-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - codecraft-network

networks:
  codecraft-network:
    driver: bridge
